<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-label="Results: invoice field accuracy 85 to 93 percent; 10-K context recall 62 to 84 percent; cost per 1K documents down 85 percent; manual processing down 50 percent; p95 latency down 40 percent; cost per query down 35 percent; maintenance overhead down 30 percent.">
<style>
  .t  { font-family: Charter, 'Bitstream Charter', 'Iowan Old Style', Georgia, 'Times New Roman', serif; font-size: 15px; font-weight: 600; font-style: normal; fill: #e6edf3; }
  .l  { font-family: Charter, 'Bitstream Charter', 'Iowan Old Style', Georgia, 'Times New Roman', serif; font-size: 14px; font-weight: 400; font-style: normal; fill: #e6edf3; }
  .s  { font-family: Charter, 'Bitstream Charter', 'Iowan Old Style', Georgia, 'Times New Roman', serif; font-size: 12.5px; font-weight: 400; font-style: normal; fill: #9198a1; }
  .n  { font-family: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; font-weight: 400; font-style: normal; fill: #9198a1; }
  .nb { font-family: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12.5px; font-weight: 600; font-style: normal; fill: #e6edf3; }
  .cap  { font-family: Charter, 'Bitstream Charter', 'Iowan Old Style', Georgia, 'Times New Roman', serif; font-size: 13px; font-weight: 400; font-style: normal; fill: #9198a1; }
  .capb { font-family: Charter, 'Bitstream Charter', 'Iowan Old Style', Georgia, 'Times New Roman', serif; font-size: 13px; font-weight: 600; font-style: normal; fill: #e6edf3; }
  .grow { transform-box: fill-box; transform-origin: left center; animation: grow .9s cubic-bezier(.2,.7,.2,1) backwards; }
  @keyframes grow { from { transform: scaleX(0); } }
  @media (prefers-reduced-motion: reduce) { .grow { animation: none; } }
</style>
