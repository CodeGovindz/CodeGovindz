<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 476" width="940" height="476" role="img" aria-label="Govind Sharma. Causal self-attention heatmap over the sentence: Govind builds agents that retrieve, reason and ship.">
<style>
  .name { font-family: Charter, 'Bitstream Charter', 'Iowan Old Style', Georgia, 'Times New Roman', serif; font-size: 46px; font-weight: 600; font-style: normal; fill: #1f2328; letter-spacing: -0.5px; }
  .lede { font-family: Charter, 'Bitstream Charter', 'Iowan Old Style', Georgia, 'Times New Roman', serif; font-size: 24px; font-weight: 400; font-style: italic; fill: #1f2328; }
  .body { font-family: Charter, 'Bitstream Charter', 'Iowan Old Style', Georgia, 'Times New Roman', serif; font-size: 15.5px; font-weight: 400; font-style: normal; fill: #59636e; }
  .tok  { font-family: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; font-weight: 400; font-style: normal; fill: #59636e; }
  .axis { font-family: Charter, 'Bitstream Charter', 'Iowan Old Style', Georgia, 'Times New Roman', serif; font-size: 12px; font-weight: 400; font-style: italic; fill: #59636e; }
  .cap  { font-family: Charter, 'Bitstream Charter', 'Iowan Old Style', Georgia, 'Times New Roman', serif; font-size: 13px; font-weight: 400; font-style: normal; fill: #59636e; }
  .capb { font-family: Charter, 'Bitstream Charter', 'Iowan Old Style', Georgia, 'Times New Roman', serif; font-size: 13px; font-weight: 600; font-style: normal; fill: #1f2328; }
  .row  { animation: decode .45s ease-out backwards; }
  @keyframes decode { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
  .cursor { animation: scan 4.5s steps(1, end) 1 both; }
  @keyframes scan { 0% { transform: translateY(0px); opacity:1 } 10% { transform: translateY(24px); opacity:1 } 20% { transform: translateY(48px); opacity:1 } 30% { transform: translateY(72px); opacity:1 } 40% { transform: translateY(96px); opacity:1 } 50% { transform: translateY(120px); opacity:1 } 60% { transform: translateY(144px); opacity:1 } 70% { transform: translateY(168px); opacity:1 } 80% { transform: translateY(192px); opacity:1 } 90% { transform: translateY(216px); opacity:1 } 100% { transform: translateY(216px); opacity: 0 } }
  @media (prefers-reduced-motion: reduce) { .row, .cursor { animation: none; } .cursor { opacity: 0; } }
</style>
<defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#eef1f4"/><line x1="0" y1="0" x2="0" y2="5" stroke="#d1d9e0" stroke-width="1.2"/></pattern><linearGradient id="cbar" x1="0" y1="1" x2="0" y2="0"><stop offset="0.0" stop-color="#440154"/><stop offset="0.1" stop-color="#482475"/><stop offset="0.2" stop-color="#414487"/><stop offset="0.3" stop-color="#355f8d"/><stop offset="0.4" stop-color="#2a788e"/><stop offset="0.5" stop-color="#21918c"/><stop offset="0.6" stop-color="#22a884"/><stop offset="0.7" stop-color="#44bf70"/><stop offset="0.8" stop-color="#7ad151"/><stop offset="0.9" stop-color="#bddf26"/><stop offset="1.0" stop-color="#fde725"/></linearGradient></defs>
<rect width="940" height="476" rx="10" fill="#ffffff"/>
<text class="name" x="44" y="132">Govind Sharma</text>
<text class="lede" x="46" y="176">Govind builds agents that</text>
<text class="lede" x="46" y="206">retrieve, reason and ship.</text>
<text class="body" x="46" y="250">AI engineer at Celebal Technologies. I take LLM systems</text>
<text class="body" x="46" y="273">from notebook to production: multi-agent orchestration,</text>
<text class="body" x="46" y="296">hybrid and graph retrieval, preference-tuned open models,</text>
<text class="body" x="46" y="319">and the evals that tell you when any of it got worse.</text>
<text class="tok" transform="translate(656.0,104) rotate(-50)">&lt;bos&gt;</text>
